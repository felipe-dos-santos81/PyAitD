[project]
name = "PyAitD"
version = "0.9.0"
description = "Alone in the Dark 1 engine reimplementation (Python/pygame-ce/ModernGL)"
requires-python = ">=3.12"
license = "GPL-2.0-only"
dependencies = [
    "pygame-ce>=2.5",
    "moderngl>=5.10",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Tools-side only, never imported from PyAitD/ (pinned by
# tests/test_layering.py::test_runtime_never_imports_a_tools_only_dependency).
# GPL-2.0-compatible, maintained, macOS arm64 / CPython 3.12 wheels:
# xatlas MIT, libigl MPL-2.0 (igl.embree bundles Apache-2.0 Embree).
tools = ["xatlas>=0.0.9", "libigl>=2.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["PyAitD*"]

[tool.setuptools.package-data]
PyAitD = ["render/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "engine: simulation, LIFE VM, formats, actors, animation, tracks, collision, navmesh, picking, AITD1 opcode handlers",
    "render: FrameDescription to pixels: scene, geometry, both backends, asset resolution, override export and check",
    "shell: app/: window, event pump, the controls package (actions, bindings, pointer/keyboard state, routing, cursor), settings schema and persistence, CLI, UI screens and modals",
    "tools: standalone scripts under tools/",
    "meta: the repo's own rules rather than its behaviour",
    "journey: drives the real run() event pump or a long real-data simulation",
]
